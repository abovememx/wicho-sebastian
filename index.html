<style>
:root{color-scheme:light;--bg:#f8f7f4;--ink:#151515;--muted:#65635f;--line:#c7c4bd}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:770px;min-height:100svh;margin:auto;padding:clamp(65px,15vh,160px) clamp(25px,7vw,70px) 45px;display:flex;flex-direction:column;justify-content:center}
h1{font-size:clamp(39px,7.6vw,70px);font-weight:400;letter-spacing:-.065em;line-height:1.075;margin:0 0 55px}
.subtitle{font-size:clamp(10px,1.9vw,13px);font-weight:400;letter-spacing:.32em;line-height:2.3;text-transform:uppercase;margin:0 0 64px}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:15px}
a{color:inherit;text-decoration:none}
.contact{border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--ink);padding:18px 8px;min-height:65px;font-size:clamp(14px,2.8vw,19px);letter-spacing:.015em;transition:background .2s,color .2s}
.contact:hover,.contact:focus-visible{background:var(--ink);color:var(--bg)}
.contact svg{width:24px;height:24px;flex-shrink:0}
.social{display:flex;align-items:center;justify-content:center;gap:0;margin:60px auto 65px;width:100%;max-width:450px}
.social span{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.04em;padding:8px 5px}
.social span+span{border-left:1px solid var(--line)}
.social small{color:var(--muted);font-weight:400;font-size:10px}
footer{border-top:1px solid var(--line);padding-top:35px;display:flex;align-items:center;justify-content:center;gap:25px}
footer .represented{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
footer .mark{border-left:1px solid var(--line);padding-left:25px;display:flex;align-items:center}
footer img{display:block;width:63px;height:auto}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:24px}
@media(max-width:530px){main{padding-top:90px;justify-content:flex-start}h1{margin-bottom:45px}.subtitle{margin-bottom:52px;letter-spacing:.23em}.contacts{gap:10px}.contact{font-size:13px;gap:7px;min-height:57px}.contact svg{width:19px;height:19px}.social{margin:52px auto 60px}footer{gap:15px}footer .represented{font-size:9px;letter-spacing:.17em}footer .mark{padding-left:15px}}
@media(max-width:360px){.contacts{grid-template-columns:1fr}.contact{font-size:16px}.subtitle{letter-spacing:.16em}}
</style>
</head>
